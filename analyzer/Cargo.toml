[package]
name = "capstone-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-credential-types = "1.3.0"
aws-sdk-s3 = "1.141.0"
axum = "0.8.9"
base64 = "0.23.1"
oxc_allocator = "0.34"
oxc_ast = "0.34"
oxc_parser = "0.34"
oxc_span = "0.34"
oxc_syntax = "0.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-sitter = "0.26.12"
tree-sitter-python = "0.25.0"
walkdir = "2.5.0"
zip = "8.6.0"

[dev-dependencies]
zip = "8.6.0"
