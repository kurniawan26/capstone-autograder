name: capstone-autograder-dev

services:
  worker:
    build:
      context: ./docker-sandbox
    image: capstone-autograder/worker:dev
    container_name: autograder-worker-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    networks:
      - sandbox
      - services
    environment:
      SANDBOX_WORKER_HOST: 0.0.0.0
      SANDBOX_WORKER_PORT: 8091
      SANDBOX_NETWORK: autograder-net-dev
      BUILDKIT_HOST: docker-container://autograder-buildkit-dev
      S3_ENDPOINT_HOST: minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_USE_SSL: "false"
      S3_SUBMISSIONS_BUCKET: submissions
      S3_SCREENSHOTS_BUCKET: screenshots
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      buildkit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  buildkit:
    image: moby/buildkit:latest
    container_name: autograder-buildkit-dev
    restart: unless-stopped
    privileged: true
    volumes:
      - buildkit_cache:/var/lib/buildkit

  minio:
    image: minio/minio:latest
    container_name: autograder-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - services
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/mc:latest
    container_name: autograder-minio-init-dev
    networks:
      - services
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["mc", "mb", "--ignore-existing", "local/submissions", "local/screenshots"]
    depends_on:
      minio:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: autograder-n8n-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - services
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Jakarta
      SANDBOX_WORKER_URL: http://autograder-worker-dev:8091
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - worker

networks:
  sandbox:
    name: autograder-net-dev

  services:
    name: autograder-services-dev

volumes:
  buildkit_cache:
  minio_data:
  n8n_data:
